<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Bookings - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-32 md:pb-16">

  <header class="bg-white/95 backdrop-blur sticky top-0 z-40 border-b border-pink-100 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 group cursor-pointer" title="Go to Home">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-400 group-hover:scale-105 transition">
        <span class="text-lg font-bold text-pink-900 group-hover:text-pink-600 transition">Rs Beauty Parlour</span>
      </a>
      <div class="flex gap-2">
        <a href="products.html" class="bg-pink-50 text-pink-800 border border-pink-200 px-3 py-1.5 rounded-full text-xs font-bold">🛍️ Store</a>
        <button onclick="openCartDrawer()" class="pink-grad text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow-sm">Cart</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 grid md:grid-cols-2 gap-8">
    <!-- QUICK SINGLE SERVICE BOOKING -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100 h-fit">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold text-pink-900">Quick Single Booking</h1>
        <button onclick="openCartDrawer()" class="text-xs bg-pink-100 text-pink-800 px-3 py-1 rounded-full font-bold">Open Cart</button>
      </div>
      <p class="text-xs text-gray-500 mt-1">Strictly for Girls & Women at your home address</p>

      <form id="booking-form" class="mt-4 space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-700">Full Name *</label>
          <input type="text" id="b-name" required class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">WhatsApp / Mobile Number *</label>
          <input type="tel" id="b-phone" required class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Select Service *</label>
          <select id="b-service" required class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm mt-1">
            <option value="VLCC Facial (₹959)">VLCC Facial (₹959)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Preferred Date & Time *</label>
          <input type="datetime-local" id="b-date" required class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Complete Home Address *</label>
          <textarea id="b-address" rows="2" required placeholder="House No, Street, Landmark, Area" class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm mt-1"></textarea>
        </div>

        <button type="submit" class="w-full pink-grad text-white py-2.5 rounded-lg font-bold text-sm shadow">
          Confirm & Send on WhatsApp
        </button>
      </form>
    </div>

    <!-- CUSTOMER ACCOUNT LIVE BOOKING & ORDER STATUS -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold text-pink-900">My Orders & Appointments</h2>
          <p class="text-xs text-gray-500 mt-0.5" id="history-subtitle">Checking your account...</p>
        </div>
        <button onclick="loadCustomerBookings()" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 px-3 py-1.5 rounded-lg font-semibold">
          ↻ Refresh
        </button>
      </div>

      <div id="my-bookings-list" class="mt-4 space-y-3"></div>
    </div>
  </main>

  
  <!-- MOBILE BOTTOM BAR -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-pink-100 z-40 shadow-[0_-4px_12px_rgba(219,39,119,0.06)]">
    <div class="grid grid-cols-5 py-2 text-center text-[11px]">
      <a href="index.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </a>
      <a href="services.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Services</span>
      </a>
      <a href="products.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Products</span>
      </a>
      <button onclick="openCartDrawer()" class="flex flex-col items-center gap-0.5 text-pink-600 relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span class="cart-badge hidden absolute top-0 right-4 bg-pink-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        <span class="font-bold">Cart</span>
      </button>
      <a href="booking.html" class="flex flex-col items-center gap-0.5 text-pink-600 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Orders</span>
      </a>
    </div>
  </nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    let currentUserId = null;

    function getStatusBadge(status) {
      if (status === 'Confirmed') {
        return '<span class="px-2.5 py-1 rounded-full bg-green-100 text-green-800 border border-green-300 font-bold text-[11px]">✓ Confirmed</span>';
      }
      if (status === 'Completed') {
        return '<span class="px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 border border-blue-300 font-bold text-[11px]">★ Completed</span>';
      }
      return '<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-300 font-bold text-[11px]">⏳ Pending</span>';
    }

    async function loadCustomerBookings() {
      if (!sb || !currentUserId) return;
      const { data: myBookings } = await sb
        .from('bookings')
        .select('*')
        .eq('user_id', currentUserId)
        .order('created_at', { ascending: false });

      const listEl = document.getElementById('my-bookings-list');
      if (!myBookings || myBookings.length === 0) {
        listEl.innerHTML = '<div class="text-center py-6 text-xs text-gray-400 bg-pink-50/50 rounded-xl">Abhi tak aapke account se koi order ya booking nahi hui hai.</div>';
        return;
      }

      listEl.innerHTML = myBookings.map(b => `
        <div class="p-4 rounded-xl bg-pink-50/70 border border-pink-200 text-xs space-y-1.5 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <span class="font-bold text-pink-950 text-sm">${b.service_name}</span>
            ${getStatusBadge(b.status)}
          </div>
          <p class="text-gray-700"><strong>Date & Time:</strong> ${b.booking_date}</p>
          <p class="text-gray-600"><strong>Address:</strong> ${b.address}</p>
          ${b.status === 'Confirmed' ? '<p class="text-green-700 font-semibold pt-1">Aapka order / booking confirm ho chuki hai!</p>' : ''}
        </div>
      `).join('');
    }

    async function initBookingPage() {
      if (sb) {
        const { data: services } = await sb.from('services').select('*').order('created_at', { ascending: true });
        if (services && services.length > 0) {
          document.getElementById('b-service').innerHTML = services.map(s =>
            `<option value="${s.name} (₹${s.price})">${s.name} (₹${s.price})</option>`
          ).join('');
        }
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('service')) {
        const sel = document.getElementById('b-service');
        const opt = document.createElement('option');
        opt.value = params.get('service');
        opt.text = params.get('service');
        opt.selected = true;
        sel.add(opt);
      }

      if (sb) {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          currentUserId = session.user.id;
          const userName = session.user.user_metadata?.full_name || session.user.email;
          document.getElementById('b-name').value = session.user.user_metadata?.full_name || '';
          document.getElementById('b-phone').value = session.user.user_metadata?.phone || '';
          document.getElementById('history-subtitle').innerText = 'Logged in as: ' + userName;
          loadCustomerBookings();
        } else {
          document.getElementById('history-subtitle').innerText = 'Login from Home page to view order status';
          document.getElementById('my-bookings-list').innerHTML = '<div class="text-center py-6 text-xs text-gray-500 bg-pink-50 rounded-xl">Apne orders aur bookings ka status dekhne ke liye Home page par <strong>Login</strong> karein.</div>';
        }
      }
    }

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const customer_name = document.getElementById('b-name').value;
      const phone = document.getElementById('b-phone').value;
      const service_name = document.getElementById('b-service').value;
      const booking_date = document.getElementById('b-date').value.replace('T', ' ');
      const address = document.getElementById('b-address').value;

      if (sb) {
        await sb.from('bookings').insert([{
          user_id: currentUserId, customer_name, phone, service_name, booking_date, address, status: 'Pending'
        }]);
        loadCustomerBookings();
      }

      const msg = `🌸 *RS BEAUTY PARLOUR — NEW HOME SERVICE BOOKING* 🌸\n\n👤 *Name:* ${customer_name}\n📱 *Mobile:* ${phone}\n💅 *Service:* ${service_name}\n📅 *Date & Time:* ${booking_date}\n🏠 *Address:* ${address}`;
      window.open(`https://wa.me/919625447178?text=${encodeURIComponent(msg)}`, '_blank');
      alert('Booking Saved! Redirecting to WhatsApp...');
    });

    initBookingPage();
  </script>
</body>
</html>
