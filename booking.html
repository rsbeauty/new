<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account & Bookings - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-24 md:pb-12">

  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-500">
        <span class="brand-font text-lg font-bold text-pink-700">Rs Beauty Parlour</span>
      </a>
      <div class="hidden md:flex gap-6 text-sm font-medium items-center text-gray-700">
        <a href="index.html" class="hover:text-pink-600">Home</a>
        <a href="services.html" class="hover:text-pink-600">Services & Menu</a>
        <a href="gallery.html" class="hover:text-pink-600">Gallery</a>
        <a href="about.html" class="hover:text-pink-600">About</a>
        <a href="booking.html" class="text-pink-600 font-bold">My Bookings</a>
        <a href="contact.html" class="hover:text-pink-600">Contact</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8 grid md:grid-cols-2 gap-8">
    <!-- LEFT: QUICK SINGLE SERVICE BOOKING -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-pink-100 h-fit">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-pink-700">Book Home Service</h1>
        <button onclick="openCartDrawer()" class="text-xs bg-pink-100 text-pink-800 px-3 py-1 rounded-full font-bold">Open Cart</button>
      </div>
      <p class="text-xs text-gray-500 mt-1">Strictly for Girls & Women at your home address</p>

      <form id="booking-form" class="mt-4 space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-700">Full Name *</label>
          <input type="text" id="b-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">WhatsApp / Mobile Number *</label>
          <input type="tel" id="b-phone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Select Service *</label>
          <select id="b-service" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1">
            <option value="VLCC Facial (₹959)">VLCC Facial (₹959)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Preferred Date & Time *</label>
          <input type="datetime-local" id="b-date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700">Complete Home Address *</label>
          <textarea id="b-address" rows="2" required placeholder="House No, Street, Landmark, Area" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1"></textarea>
        </div>

        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2.5 rounded-lg font-semibold text-sm shadow">
          Confirm & Send on WhatsApp
        </button>
      </form>
    </div>

    <!-- RIGHT: CUSTOMER ACCOUNT LIVE BOOKING STATUS -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-pink-100">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold text-pink-700">My Appointments Status</h2>
          <p class="text-xs text-gray-500 mt-0.5" id="history-subtitle">Checking your account...</p>
        </div>
        <button onclick="loadCustomerBookings()" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 px-3 py-1.5 rounded-lg font-semibold">
          ↻ Refresh
        </button>
      </div>

      <div id="my-bookings-list" class="mt-4 space-y-3"></div>
    </div>
  </main>

  <!-- MOBILE APP-STYLE FIXED BOTTOM NAVIGATION -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-pink-100 shadow-[0_-4px_12px_rgba(0,0,0,0.06)] z-40">
    <div class="grid grid-cols-5 py-2 text-center text-[11px]">
      <a href="index.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </a>
      <a href="services.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Menu</span>
      </a>
      <button onclick="openCartDrawer()" class="flex flex-col items-center justify-center gap-0.5 relative">
        <div class="bg-pink-600 text-white p-1.5 rounded-full -mt-4 shadow-md border-2 border-white relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-badge hidden absolute -top-1.5 -right-1.5 bg-green-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </div>
        <span class="font-semibold text-pink-600">Cart</span>
      </button>
      <a href="gallery.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Gallery</span>
      </a>
      <a href="contact.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        <span>Contact</span>
      </a>
    </div>
  </nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    let currentUserId = null;

    function getStatusBadge(status) {
      if (status === 'Confirmed') {
        return '<span class="px-2.5 py-1 rounded-full bg-green-100 text-green-800 border border-green-300 font-bold text-[11px]">✓ Confirmed by Salon</span>';
      }
      if (status === 'Completed') {
        return '<span class="px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 border border-blue-300 font-bold text-[11px]">★ Completed</span>';
      }
      return '<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-300 font-bold text-[11px]">⏳ Pending Confirmation</span>';
    }

    async function loadCustomerBookings() {
      if (!sb || !currentUserId) return;
      const { data: myBookings, error } = await sb
        .from('bookings')
        .select('*')
        .eq('user_id', currentUserId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const listEl = document.getElementById('my-bookings-list');
      if (!myBookings || myBookings.length === 0) {
        listEl.innerHTML = '<div class="text-center py-6 text-xs text-gray-400 bg-pink-50/50 rounded-xl">Abhi tak aapke account se koi booking nahi hui hai.</div>';
        return;
      }

      listEl.innerHTML = myBookings.map(b => `
        <div class="p-4 rounded-xl bg-pink-50/70 border border-pink-200 text-xs space-y-1.5 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <span class="font-bold text-pink-900 text-sm">${b.service_name}</span>
            ${getStatusBadge(b.status)}
          </div>
          <p class="text-gray-700"><strong>Date & Time:</strong> ${b.booking_date}</p>
          <p class="text-gray-600"><strong>Address:</strong> ${b.address}</p>
          ${b.status === 'Confirmed' ? '<p class="text-green-700 font-semibold pt-1">Aapki booking confirm ho chuki hai! Hamari beautician time par aapke ghar pahunch jayengi.</p>' : ''}
        </div>
      `).join('');
    }

    async function initBookingPage() {
      if (sb) {
        const { data: services } = await sb.from('services').select('*').order('created_at', { ascending: true });
        if (services && services.length > 0) {
          document.getElementById('b-service').innerHTML = services.map(s =>
            `<option value="${s.name} (₹${s.price})">${s.name} (₹${s.price})</option>`
          ).join('');
        }
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('service')) {
        const sel = document.getElementById('b-service');
        const opt = document.createElement('option');
        opt.value = params.get('service');
        opt.text = params.get('service');
        opt.selected = true;
        sel.add(opt);
      }

      if (sb) {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          currentUserId = session.user.id;
          const userName = session.user.user_metadata?.full_name || session.user.email;
          document.getElementById('b-name').value = session.user.user_metadata?.full_name || '';
          document.getElementById('b-phone').value = session.user.user_metadata?.phone || '';
          document.getElementById('history-subtitle').innerText = 'Logged in as: ' + userName;
          loadCustomerBookings();
        } else {
          document.getElementById('history-subtitle').innerText = 'Please login from Home page to see your booking status';
          document.getElementById('my-bookings-list').innerHTML = '<div class="text-center py-6 text-xs text-gray-500 bg-pink-50 rounded-xl">Apni booking ka status dekhne ke liye Home page par <strong>Customer Login</strong> karein.</div>';
        }
      }
    }

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const customer_name = document.getElementById('b-name').value;
      const phone = document.getElementById('b-phone').value;
      const service_name = document.getElementById('b-service').value;
      const booking_date = document.getElementById('b-date').value.replace('T', ' ');
      const address = document.getElementById('b-address').value;

      if (sb) {
        await sb.from('bookings').insert([{
          user_id: currentUserId, customer_name, phone, service_name, booking_date, address, status: 'Pending'
        }]);
        loadCustomerBookings();
      }

      const msg = `🌸 *RS BEAUTY PARLOUR — NEW HOME SERVICE BOOKING* 🌸\n\n👤 *Name:* ${customer_name}\n📱 *Mobile:* ${phone}\n💅 *Service:* ${service_name}\n📅 *Date & Time:* ${booking_date}\n🏠 *Address:* ${address}`;
      window.open(`https://wa.me/919625447178?text=${encodeURIComponent(msg)}`, '_blank');
      alert('Booking Saved! Redirecting to WhatsApp...');
    });

    initBookingPage();
  </script>
</body>
</html>
