<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Menu - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-28 md:pb-16">

  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-500">
        <span class="brand-font text-lg font-bold text-pink-700">Rs Beauty Parlour</span>
      </a>
      <div class="hidden md:flex gap-6 text-sm font-medium items-center text-gray-700">
        <a href="index.html" class="hover:text-pink-600">Home</a>
        <a href="services.html" class="text-pink-600 font-bold">Services & Menu</a>
        <a href="gallery.html" class="hover:text-pink-600">Gallery</a>
        <a href="about.html" class="hover:text-pink-600">About</a>
        <a href="contact.html" class="hover:text-pink-600">Contact</a>
      </div>
      <button onclick="openCartDrawer()" class="relative bg-pink-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow">
        <span>Cart</span>
        <span class="cart-badge hidden bg-white text-pink-700 text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-pink-800 text-center">Home Salon Rate Card</h1>
    <p class="text-center text-xs md:text-sm text-gray-600 mt-1">Add multiple services to cart & send full list on WhatsApp</p>

    <!-- SEARCH BAR -->
    <div class="max-w-md mx-auto mt-4">
      <input type="text" id="menu-search" onkeyup="searchServices()" placeholder="Search service (e.g. Facial, Rica, Bridal, Waxing)..." class="w-full border border-pink-200 rounded-full px-4 py-2 text-xs bg-white shadow-sm focus:outline-none focus:border-pink-500">
    </div>

    <!-- CATEGORY FILTER BUTTONS -->
    <div id="category-tabs" class="flex flex-wrap justify-center gap-2 mt-4">
      <button onclick="filterCategory('All', this)" class="cat-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm">All Services</button>
    </div>

    <!-- SERVICES GRID -->
    <div id="all-services-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 mt-6">
      <p class="col-span-full text-center text-gray-500 text-sm">Loading menu...</p>
    </div>
  </main>

  
  <!-- MOBILE APP-STYLE FIXED BOTTOM NAVIGATION -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-pink-100 shadow-[0_-4px_12px_rgba(0,0,0,0.06)] z-40">
    <div class="grid grid-cols-5 py-2 text-center text-[11px]">
      <a href="index.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </a>
      <a href="services.html" class="flex flex-col items-center justify-center gap-0.5 text-pink-600 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Menu</span>
      </a>
      <button onclick="openCartDrawer()" class="flex flex-col items-center justify-center gap-0.5 relative">
        <div class="bg-pink-600 text-white p-1.5 rounded-full -mt-4 shadow-md border-2 border-white relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-badge hidden absolute -top-1.5 -right-1.5 bg-green-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </div>
        <span class="font-semibold text-pink-600">Cart</span>
      </button>
      <a href="gallery.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Gallery</span>
      </a>
      <a href="contact.html" class="flex flex-col items-center justify-center gap-0.5 text-gray-500 hover:text-pink-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        <span>Contact</span>
      </a>
    </div>
  </nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    let allServices = [];
    let activeCategory = 'All';

    async function loadMenu() {
      if (!sb) return;
      const { data: services } = await sb.from('services').select('*').order('created_at', { ascending: true });
      allServices = services || [];
      if (allServices.length === 0) return;

      const categories = ['All', ...new Set(allServices.map(s => s.category || 'General'))];
      document.getElementById('category-tabs').innerHTML = categories.map((cat, idx) => `
        <button onclick="filterCategory('${cat}', this)" class="cat-btn ${idx === 0 ? 'bg-pink-600 text-white' : 'bg-white text-pink-800 border border-pink-200'} px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm transition">
          ${cat}
        </button>
      `).join('');

      renderServices(allServices);
    }

    function filterCategory(category, btn) {
      activeCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-pink-600', 'text-white');
        b.classList.add('bg-white', 'text-pink-800', 'border', 'border-pink-200');
      });
      btn.classList.remove('bg-white', 'text-pink-800', 'border', 'border-pink-200');
      btn.classList.add('bg-pink-600', 'text-white');
      searchServices();
    }

    function searchServices() {
      const q = document.getElementById('menu-search').value.toLowerCase();
      const filtered = allServices.filter(s => {
        const matchCat = activeCategory === 'All' || (s.category || 'General') === activeCategory;
        const matchText = s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q);
        return matchCat && matchText;
      });
      renderServices(filtered);
    }

    function renderServices(list) {
      if (list.length === 0) {
        document.getElementById('all-services-grid').innerHTML = `<p class="col-span-full text-center text-gray-400 text-xs py-8">No matching service found.</p>`;
        return;
      }
      document.getElementById('all-services-grid').innerHTML = list.map(s => {
        const safeName = s.name.replace(/'/g, "\\'");
        const safeCat = (s.category || 'Salon').replace(/'/g, "\\'");
        return `
        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <div>
            ${s.image_url ? `<img src="${s.image_url}" class="w-full h-44 object-cover" alt="${s.name}">` : ''}
            <div class="p-4">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <span class="text-[10px] uppercase tracking-wider bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full font-semibold">${s.category || 'Salon'}</span>
                  <h2 class="font-bold text-base text-gray-800 mt-1.5">${s.name}</h2>
                </div>
                <span class="text-pink-600 font-bold text-lg whitespace-nowrap">₹${s.price}</span>
              </div>
              <p class="text-xs text-gray-500 mt-1.5">${s.description || ''}</p>
            </div>
          </div>
          <div class="p-4 pt-0 grid grid-cols-2 gap-2">
            <button onclick="addToCart('${s.id}', '${safeName}', ${s.price}, '${safeCat}')" class="bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-lg text-xs font-bold shadow-sm">
              + Add to Cart
            </button>
            <a href="booking.html?service=${encodeURIComponent(s.name + ' (₹' + s.price + ')')}" class="block text-center bg-pink-50 hover:bg-pink-100 text-pink-800 border border-pink-200 py-2 rounded-lg text-xs font-semibold">
              Single Book
            </a>
          </div>
        </div>`;
      }).join('');
    }

    loadMenu();
  </script>
</body>
</html>
