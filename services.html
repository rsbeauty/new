<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Menu - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-500">
        <span class="brand-font text-lg font-bold text-pink-700">Rs Beauty Parlour</span>
      </a>
      <div class="flex gap-4 text-xs md:text-sm font-medium items-center">
        <a href="index.html" class="hover:text-pink-600">Home</a>
        <a href="services.html" class="text-pink-600 font-bold">Menu</a>
        <a href="gallery.html" class="hover:text-pink-600">Gallery</a>
        <a href="booking.html" class="bg-pink-600 text-white px-3 py-1.5 rounded-full">Book Now</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-pink-800 text-center">Home Salon Rate Card</h1>
    <p class="text-center text-xs md:text-sm text-gray-600 mt-1">Ladies Home Service Only • Tap any service to book on WhatsApp</p>

    <!-- CATEGORY FILTER BUTTONS -->
    <div id="category-tabs" class="flex flex-wrap justify-center gap-2 mt-6">
      <button onclick="filterCategory('All', this)" class="cat-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm">All Services</button>
    </div>

    <!-- SERVICES GRID -->
    <div id="all-services-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 mt-6">
      <p class="col-span-full text-center text-gray-500 text-sm">Loading menu...</p>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script>
    let allServices = [];

    async function loadMenu() {
      if (!sb) return;
      const { data: services } = await sb.from('services').select('*').order('created_at', { ascending: true });
      allServices = services || [];
      if (allServices.length === 0) return;

      // Generate Dynamic Category Tabs
      const categories = ['All', ...new Set(allServices.map(s => s.category || 'General'))];
      document.getElementById('category-tabs').innerHTML = categories.map((cat, idx) => `
        <button onclick="filterCategory('${cat}', this)" class="cat-btn ${idx === 0 ? 'bg-pink-600 text-white' : 'bg-white text-pink-800 border border-pink-200'} px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm transition">
          ${cat}
        </button>
      `).join('');

      renderServices(allServices);
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-pink-600', 'text-white');
        b.classList.add('bg-white', 'text-pink-800', 'border', 'border-pink-200');
      });
      btn.classList.remove('bg-white', 'text-pink-800', 'border', 'border-pink-200');
      btn.classList.add('bg-pink-600', 'text-white');

      const filtered = category === 'All'
        ? allServices
        : allServices.filter(s => (s.category || 'General') === category);
      renderServices(filtered);
    }

    function renderServices(list) {
      document.getElementById('all-services-grid').innerHTML = list.map(s => `
        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <div>
            ${s.image_url ? `<img src="${s.image_url}" class="w-full h-44 object-cover" alt="${s.name}">` : ''}
            <div class="p-4">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <span class="text-[10px] uppercase tracking-wider bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full font-semibold">${s.category || 'Salon'}</span>
                  <h2 class="font-bold text-base text-gray-800 mt-1.5">${s.name}</h2>
                </div>
                <span class="text-pink-600 font-bold text-lg whitespace-nowrap">₹${s.price}</span>
              </div>
              <p class="text-xs text-gray-500 mt-1.5">${s.description || ''}</p>
            </div>
          </div>
          <div class="p-4 pt-0">
            <a href="booking.html?service=${encodeURIComponent(s.name + ' (₹' + s.price + ')')}" class="block text-center bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-lg text-xs font-semibold">
              Book Home Visit
            </a>
          </div>
        </div>
      `).join('');
    }

    loadMenu();
  </script>
</body>
</html>
