<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-500">
        <span class="brand-font text-lg font-bold text-pink-700">Rs Beauty Parlour</span>
      </a>
      <div class="flex gap-4 text-xs md:text-sm font-medium items-center">
        <a href="index.html" class="hover:text-pink-600">Home</a>
        <a href="services.html" class="hover:text-pink-600">Menu</a>
        <a href="gallery.html" class="text-pink-600 font-bold">Gallery</a>
        <a href="booking.html" class="bg-pink-600 text-white px-3 py-1.5 rounded-full">Book Now</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-pink-800 text-center">Our Work Gallery</h1>
    <p class="text-center text-xs text-gray-600 mt-1">Bridal Makeup, Hair Styling & Skincare Transformations</p>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-8">
      <img src="assets/images/services/makeup.jpg" onerror="this.src='https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Makeup">
      <img src="assets/images/services/hair.jpg" onerror="this.src='https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Hair">
      <img src="assets/images/services/facial.jpg" onerror="this.src='https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Facial">
      <img src="assets/images/sliders/banner1.jpeg" onerror="this.src='https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Salon">
      <img src="assets/images/sliders/banner2.jpeg" onerror="this.src='https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Bridal">
      <img src="assets/images/sliders/banner3.jpeg" onerror="this.src='https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?auto=format&fit=crop&w=600&q=80'" class="w-full h-56 object-cover rounded-xl shadow-sm" alt="Beauty">
    </div>
  </main>
</body>
</html>
