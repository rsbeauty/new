<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Rs Beauty Parlour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-32 md:pb-16">
  <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-pink-100">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 group cursor-pointer">
        <img src="assets/images/logo/logo.jpeg" onerror="this.src='https://placehold.co/100x100/db2777/white?text=RS'" alt="Logo" class="h-10 w-10 rounded-full object-cover border-2 border-pink-400">
        <span class="text-lg font-bold text-pink-900 group-hover:text-pink-600">Rs Beauty Parlour</span>
      </a>
      <a href="services.html" class="pink-grad text-white px-4 py-1.5 rounded-full text-xs font-bold">Book Service</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-extrabold text-pink-950 text-center">Our Work Gallery</h1>
    <p class="text-center text-xs text-gray-600 mt-1">Bridal Makeup, Hair Styling & Skincare Transformations</p>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6">
      <img src="assets/images/services/makeup.jpg" onerror="this.src='https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Makeup">
      <img src="assets/images/services/hair.jpg" onerror="this.src='https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Hair">
      <img src="assets/images/services/facial.jpg" onerror="this.src='https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Facial">
      <img src="assets/images/sliders/banner1.jpeg" onerror="this.src='https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Salon">
      <img src="assets/images/sliders/banner2.jpeg" onerror="this.src='https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Bridal">
      <img src="assets/images/sliders/banner3.jpeg" onerror="this.src='https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?auto=format&fit=crop&w=600&q=80'" class="w-full h-52 object-cover rounded-2xl border border-pink-100 shadow-sm" alt="Beauty">
    </div>
  </main>

  
  <!-- MOBILE BOTTOM BAR -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-pink-100 z-40 shadow-[0_-4px_12px_rgba(219,39,119,0.06)]">
    <div class="grid grid-cols-5 py-2 text-center text-[11px]">
      <a href="index.html" class="flex flex-col items-center gap-0.5 text-pink-600 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </a>
      <a href="services.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Services</span>
      </a>
      <a href="products.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Products</span>
      </a>
      <button onclick="openCartDrawer()" class="flex flex-col items-center gap-0.5 text-pink-600 relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span class="cart-badge hidden absolute top-0 right-4 bg-pink-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        <span class="font-bold">Cart</span>
      </button>
      <a href="booking.html" class="flex flex-col items-center gap-0.5 text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Orders</span>
      </a>
    </div>
  </nav>
  <script src="assets/js/cart.js"></script>
</body>
</html>
